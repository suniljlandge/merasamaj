<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>
Registration Leaderboard
</title>

<link
  rel="stylesheet"
  href="{{ url_for('static', filename='styles.css') }}"
>

<style>

.page-container{
    max-width:1100px;
    margin:auto;
    padding:30px;
}

.page-title{
    font-size:32px;
    font-weight:700;
    margin-bottom:20px;
}

.operator-dashboard{
    background:white;
    border-radius:20px;
    padding:24px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.dashboard-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:24px;
}

.total-card{
    text-align:right;
}

.total-card strong{
    display:block;
    font-size:34px;
}

.operator-item{
    margin-bottom:18px;
}

.operator-top{
    display:flex;
    justify-content:space-between;
    margin-bottom:6px;
}

.rank-badge{
    width:32px;
    height:32px;
    border-radius:50%;
    background:#e2e8f0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.operator-name{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:600;
}

.progress-track{
    height:16px;
    background:#e5e7eb;
    border-radius:999px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    background:linear-gradient(
      90deg,
      #2563eb,
      #60a5fa
    );
}

.stats-grid{
    display:grid;
    grid-template-columns:
      repeat(auto-fit,minmax(220px,1fr));
    gap:16px;
    margin-bottom:24px;
}

.stat-card{
    background:#fff;
    border-radius:14px;
    padding:18px;
    box-shadow:0 4px 12px rgba(0,0,0,.06);
}

.stat-card h3{
    margin:0;
    color:#64748b;
    font-size:14px;
}

.stat-card strong{
    display:block;
    margin-top:8px;
    font-size:30px;
}

.podium {
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:24px;
    margin:30px 0 40px;
}

.podium-card{
    flex:1;
    max-width:280px;
    text-align:center;
}

.podium-rank{
    font-size:48px;
    margin-bottom:10px;
}

.podium-box{
    border-radius:18px 18px 0 0;
    padding:20px;
    color:#001b33;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.podium-first .podium-box{
    height:240px;
    background:linear-gradient(
        135deg,
        #fde68a,
        #fbbf24
    );
}

.podium-second .podium-box{
    height:190px;
    background:linear-gradient(
        135deg,
        #e5e7eb,
        #cbd5e1
    );
}

.podium-third .podium-box{
    height:160px;
    background:linear-gradient(
        135deg,
        #fdba74,
        #fb923c
    );
}

.podium-name{
    font-size:24px;
    font-weight:700;
    margin-bottom:10px;
    word-break:break-word;
}

.podium-count{
    font-size:18px;
    margin-bottom:10px;
}

.podium-share{
    font-size:32px;
    font-weight:700;
}

.operator-item{
    margin-bottom:22px;
}

.operator-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
}

.operator-name{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:600;
    font-size:18px;
}

.rank-badge{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#e2e8f0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:18px;
}

.progress-track{
    height:20px;
    background:#d1d5db;
    border-radius:999px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    background:linear-gradient(
        90deg,
        #2563eb,
        #60a5fa
    );
}

.report-brand{
    text-align:center;
    margin-bottom:30px;
    padding-bottom:20px;
    border-bottom:2px solid #e5e7eb;
}

.report-brand h1{
    margin:0;
    font-size:42px;
    font-weight:800;
    letter-spacing:2px;
}

.report-subtitle{
    font-size:18px;
    color:#64748b;
    margin-top:8px;
}

#reportDate{
    margin-top:8px;
    font-size:14px;
    color:#1156b8;
}

@media (max-width:768px){

    .dashboard-header{
        flex-direction:column;
        text-align:center;
        gap:15px;
    }

    .podium{
        flex-direction:column;
        align-items:stretch;
    }

    .podium-card{
        max-width:none;
    }

    .operator-top{
        flex-direction:column;
        align-items:flex-start;
        gap:6px;
    }
}

.title-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.page-title{
    margin:0;
}

.report-date{
    color:#1156b8;
    font-size:16px;
    font-weight:600;
}

@media (max-width:768px){

    .title-row{
        flex-direction:column;
        align-items:flex-start;
        gap:8px;
    }
}

</style>

</head>

<body>

<div
    class="page-container"
    id="leaderboardReport"
>

<div
    id="exportControls"
    style="text-align:right;margin-bottom:20px;"
>

    <button
        id="exportLeaderboard"
        class="button-primary"
    >
        📷 Export as Image
    </button>

</div>
<div class="title-row">

    <h1 class="page-title">
        🏆 Samaj Registration Leaderboard
    </h1>

    <div id="reportDate" class="report-date">
    </div>

</div>

<div class="stats-grid">

    <div class="stat-card">
        <h3>Total Registrations Completed</h3>
        <strong id="totalRegistrations">
            0
        </strong>
    </div>

<div class="stat-card">
    <h3>Active Operators</h3>

    <strong id="activeOperators">
        0/0
    </strong>
</div>

    <div class="stat-card">
        <h3>Top Performer</h3>
        <strong id="topOperator">
            -
        </strong>
    </div>

</div>

<div class="operator-dashboard">

    <div class="dashboard-header">

        <div>
            <h2>
                Operator Performance
            </h2>
            <p>
                Based on total registrations
            </p>
        </div>

        <div class="total-card">
            <span>Total Registrations Completed</span>
            <strong id="headerTotal">
                0
            </strong>
        </div>

    </div>

    <div id="podiumContainer"></div>

    <div id="operatorRanking"></div>

</div>

</div>

<script>

async function loadLeaderboard() {

    const response =
        await fetch(
            "/api/operator-performance"
        );

    const data =
        await response.json();

    document.getElementById(
        "totalRegistrations"
    ).textContent =
        data.total;

    document.getElementById(
        "headerTotal"
    ).textContent =
        data.total;

    const activePercent =
        data.totalOperators
        ? Math.round(
            (
                data.activeOperators
                / data.totalOperators
            ) * 100
          )
        : 0;

document.getElementById(
    "activeOperators"
).textContent =
    `${data.activeOperators}/${data.totalOperators} (${activePercent}%)`;

    document.getElementById(
        "topOperator"
    ).textContent =
        data.topOperator;

    if (
        data.items &&
        data.items.length
    ) {
        renderLeaderboard(
            data.items
        );
    }
}



function renderLeaderboard(operators){

    renderPodium(operators);

    const max =
        operators[0].count;

    document.getElementById(
        "operatorRanking"
    ).innerHTML =
        operators
            .slice(3)
            .map(
                (op,index)=>`

                <div class="operator-item">

                    <div class="operator-top">

                        <div class="operator-name">

                            <div class="rank-badge">
                                ${index + 4}
                            </div>

                            ${op.name}

                        </div>

                        <div>
                            ${op.count}
                            registrations
                            (${op.share}%)
                        </div>

                    </div>

                    <div class="progress-track">

                        <div
                            class="progress-bar"
                            style="
                                width:${
                                    (
                                        op.count
                                        / max
                                    ) * 100
                                }%;
                            "
                        ></div>

                    </div>

                </div>
            `
            )
            .join("");
}

function renderPodium(operators){

    const first =
        operators[0];

    const second =
        operators[1];

    const third =
        operators[2];

    document.getElementById(
        "podiumContainer"
    ).innerHTML = `

        <div class="podium">

            ${
                second ? `
                <div class="podium-card podium-second">

                    <div class="podium-rank">
                        🥈
                    </div>

                    <div class="podium-box">

                        <div class="podium-name">
                            ${second.name}
                        </div>

                        <div class="podium-count">
                            ${second.count}
                            Registrations
                        </div>

                        <div class="podium-share">
                            ${second.share}%
                        </div>

                    </div>

                </div>
                ` : ""
            }

            ${
                first ? `
                <div class="podium-card podium-first">

                    <div class="podium-rank">
                        🥇
                    </div>

                    <div class="podium-box">

                        <div class="podium-name">
                            ${first.name}
                        </div>

                        <div class="podium-count">
                            ${first.count}
                            Registrations
                        </div>

                        <div class="podium-share">
                            ${first.share}%
                        </div>

                    </div>

                </div>
                ` : ""
            }

            ${
                third ? `
                <div class="podium-card podium-third">

                    <div class="podium-rank">
                        🥉
                    </div>

                    <div class="podium-box">

                        <div class="podium-name">
                            ${third.name}
                        </div>

                        <div class="podium-count">
                            ${third.count}
                            Registrations
                        </div>

                        <div class="podium-share">
                            ${third.share}%
                        </div>

                    </div>

                </div>
                ` : ""
            }

        </div>
    `;
}

document.getElementById(
    "reportDate"
).textContent =
    new Date().toLocaleDateString(
        "en-IN",
        {
            day:"2-digit",
            month:"long",
            year:"numeric"
        }
    );


document
    .getElementById(
        "exportLeaderboard"
    )
    .addEventListener(
        "click",
        async () => {

            const controls =
                document.getElementById(
                    "exportControls"
                );

            controls.style.display =
                "none";

            const canvas =
                await html2canvas(
                    document.getElementById(
                        "leaderboardReport"
                    ),
                    {
                        scale: 2,
                        useCORS: true,
                        backgroundColor:
                            "#ffffff"
                    }
                );

            controls.style.display =
                "";

            const link =
                document.createElement(
                    "a"
                );

            const today =
                new Date()
                    .toISOString()
                    .slice(0,10);

            link.download =
                `registration-leaderboard-${today}.png`;

            link.href =
                canvas.toDataURL(
                    "image/png"
                );

            link.click();

        }
    );

loadLeaderboard();
</script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

{% include "_footer.html" %}

</body>
</html>
