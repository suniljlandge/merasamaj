<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    >
    <title>Family Tree</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    >
    <link
      rel="icon"
      href="{{ url_for('static', filename='favicon.png') }}"
      type="image/png"
    >
    <link
      rel="stylesheet"
      href="https://unpkg.com/@xyflow/react@12.10.2/dist/style.css"
    >
    <script>
      window.CURRENT_ROLE = "{{ current_role }}";
    </script>
    <style>
      .family-tree-shell {
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, rgba(16, 185, 129, 0.18), transparent 32%),
          radial-gradient(circle at top right, rgba(59, 130, 246, 0.18), transparent 28%),
          linear-gradient(180deg, #f8fafc 0%, #ecfeff 100%);
      }

      .family-tree-main {
        max-width: 1400px;
        margin: 0 auto;
        padding: 12px 16px;
      }

      .family-tree-hero,
      .family-tree-canvas {
        background: rgba(255, 255, 255, 0.86);
        backdrop-filter: blur(18px);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      }

      .family-tree-hero {
        padding: 8px 14px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .family-tree-identity {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1 1 auto;
        min-width: 0;
      }

      .family-tree-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .family-tree-eyebrow {
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        font-size: 10px;
        color: #0f766e;
        font-weight: 700;
        padding: 5px 9px;
        border-radius: 999px;
        background: #ecfeff;
        white-space: nowrap;
      }

      .family-tree-title {
        margin: 0;
        font-size: clamp(1.1rem, 2vw, 1.6rem);
        line-height: 1.1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
      }

      .family-tree-meta {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
      }

      .family-tree-chip {
        border-radius: 999px;
        padding: 5px 10px;
        background: #f0fdfa;
        color: #115e59;
        font-weight: 700;
        font-size: 0.82rem;
      }

      .family-tree-canvas {
        height: calc(100vh - 130px);
        min-height: 480px;
        overflow: hidden;
      }

      #family-tree-flow {
        width: 100%;
        height: 100%;
      }

      .tree-loading,
      .tree-error {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        color: #334155;
        font-weight: 600;
      }

      @media (max-width: 768px) {
        .family-tree-main {
          padding: 10px 12px;
        }

        .family-tree-hero {
          padding: 8px 12px;
          align-items: flex-start;
        }

        .family-tree-identity {
          width: 100%;
          flex-wrap: wrap;
        }

        .family-tree-actions {
          width: 100%;
          justify-content: flex-start;
          margin-top: 8px;
        }

        .family-tree-title {
          white-space: normal;
        }

        .family-tree-canvas {
          min-height: 420px;
          height: calc(100vh - 160px);
        }
      }
    </style>
  </head>
  <body class="family-tree-shell">
    <header class="topbar">
      <a
        href="/directory"
        class="brand"
      >
        <span
          class="brand-mark"
          aria-hidden="true"
        ></span>
        <span>SAMAJ</span>
      </a>

      <div class="directory-top-actions">
        <a
          href="/directory"
          class="button-secondary"
        >
          Back to directory
        </a>
      </div>
    </header>

    <main class="family-tree-main">
      <section class="family-tree-hero">
        <div class="family-tree-identity">
          <p class="family-tree-eyebrow">
            Family Tree
          </p>
          <h1
            id="family-tree-title"
            class="family-tree-title"
          >
            Loading family tree...
          </h1>
        </div>
        <div class="family-tree-meta">
          <div class="family-tree-actions" id="family-tree-actions" style="order:0">
            <button
              id="family-tree-view-button"
              class="button-secondary"
              style="display:none"
            >
              View
            </button>

            <button
              id="family-tree-invitation-button"
              class="button-secondary"
              style="display:none; color:#7c3aed; border-color:#c4b5fd;"
            >
              ✉ Invitation
            </button>

            <span
              id="family-tree-invitation-chip"
              class="family-tree-chip"
              style="display:none; background:#f5f3ff; color:#7c3aed;"
            >
              <span id="family-tree-invitation-name"></span>
            </span>

            <span
              id="family-tree-creator"
              class="family-tree-chip"
              style="display:none"
            >
              <span id="family-tree-creator-name"></span>
            </span>
          </div>
          <span
            class="family-tree-chip"
            id="family-tree-count"
          >
            Preparing graph...
          </span>
          <span class="family-tree-chip">
            Name-only nodes
          </span>
        </div>
      </section>

      <section class="family-tree-canvas">
        <div id="family-tree-flow">
          <div class="tree-loading">
            Loading family tree...
          </div>
        </div>
      </section>
    </main>

    <script type="module">
      import React from "https://esm.sh/react@18.3.1?dev";
      import { createRoot } from "https://esm.sh/react-dom@18.3.1/client?dev";
      import {
        Background,
        Controls,
        Handle,
        MiniMap,
        Panel,
        Position,
        ReactFlow,
        ReactFlowProvider,
        useReactFlow,
      } from "https://esm.sh/@xyflow/react@12.10.2?dev&bundle&deps=react@18.3.1,react-dom@18.3.1";

      const memberId =
        window.location.pathname
          .split("/")
          .pop();

      const titleElement =
        document.querySelector(
          "#family-tree-title"
        );
      const countElement =
        document.querySelector(
          "#family-tree-count"
        );
      const flowElement =
        document.querySelector(
          "#family-tree-flow"
        );

      function escapeHtml(value = "") {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function renderError(message) {
        flowElement.innerHTML = `
          <div class="tree-error">
            ${escapeHtml(message)}
          </div>
        `;
      }

      window.addEventListener(
        "error",
        (event) => {
          renderError(
            event.error?.message
            || event.message
            || "Tree rendering failed."
          );
        }
      );

      window.addEventListener(
        "unhandledrejection",
        (event) => {
          const reason =
            event.reason?.message
            || String(event.reason || "");

          if (reason) {
            renderError(reason);
          }
        }
      );

      function createStyledNodes(nodes = []) {
        return nodes.map((node) => {
          return {
            ...node,
            type: "familyUnit",
            draggable: true,
            style: {
              background: "transparent",
              border: "none",
              boxShadow: "none",
              padding: 0,
            },
            data: {
              ...node.data,
              label: node.data?.fullName || "Unnamed member",
            },
          };
        });
      }

      function normalizeRelation(value = "") {
        return String(value || "")
          .toLowerCase()
          .split("(")[0]
          .trim();
      }

      function isSpouseRelation(value = "") {
        return [
          "wife",
          "husband",
          "spouse",
          "daughter-in-law",
          "son-in-law",
        ].includes(
          normalizeRelation(value)
        );
      }

      function memberPriority(member) {
        if (member.data?.isApplicant) {
          return 0;
        }

        return isSpouseRelation(
          member.data?.relationToApplicant
        ) ? 2 : 1;
      }

      function createDisplayGraph(
        rawNodes = [],
        rawEdges = []
      ) {
        const rawNodesById =
          Object.fromEntries(
            rawNodes.map((node) => [
              node.id,
              node,
            ])
          );
        const spouseLinks =
          new Map();

        rawEdges
          .filter(
            (edge) =>
              edge.data?.relationType === "spouse_of"
          )
          .forEach((edge) => {
            spouseLinks.set(
              edge.source,
              edge.target
            );
            spouseLinks.set(
              edge.target,
              edge.source
            );
          });

        const displayNodes = [];
        const rawToDisplay = new Map();

        rawNodes
          .slice()
          .sort(
            (left, right) =>
              left.position.y - right.position.y
              || left.position.x - right.position.x
          )
          .forEach((node) => {
            if (rawToDisplay.has(node.id)) {
              return;
            }

            const partnerId =
              spouseLinks.get(node.id);
            const partner =
              partnerId
              ? rawNodesById[partnerId]
              : null;

            if (
              partner
              && !rawToDisplay.has(partner.id)
            ) {
              const members =
                [node, partner]
                  .sort(
                    (left, right) =>
                      memberPriority(left)
                      - memberPriority(right)
                  );
              const primary =
                members[0];
              const secondary =
                members[1];
              const displayId =
                [primary.id, secondary.id]
                  .sort()
                  .join("__");

              rawToDisplay.set(
                primary.id,
                displayId
              );
              rawToDisplay.set(
                secondary.id,
                displayId
              );

              displayNodes.push({
                id: displayId,
                position: {
                  x: (
                    primary.position.x
                    + secondary.position.x
                  ) / 2,
                  y: (
                    primary.position.y
                    + secondary.position.y
                  ) / 2,
                },
                data: {
                  ...primary.data,
                  isCouple: true,
                  primaryName:
                    primary.data?.fullName || "",
                  partnerName:
                    secondary.data?.fullName || "",
                  partnerRelation:
                    secondary.data?.relationToApplicant
                    || "",
                  currentCity:
                    primary.data?.currentCity
                    || secondary.data?.currentCity
                    || "",
                  isMarried: true,
                },
                draggable: true,
                selectable: true,
              });

              return;
            }

            rawToDisplay.set(
              node.id,
              node.id
            );
            displayNodes.push({
              ...node,
              data: {
                ...node.data,
                isCouple: false,
                primaryName:
                  node.data?.fullName || "",
                partnerName: "",
              },
            });
          });

        const seenEdges =
          new Set();
        const displayEdges = [];

        rawEdges
          .filter(
            (edge) =>
              edge.data?.relationType !== "spouse_of"
          )
          .forEach((edge) => {
            const source =
              rawToDisplay.get(edge.source);
            const target =
              rawToDisplay.get(edge.target);

            if (
              !source
              || !target
              || source === target
            ) {
              return;
            }

            const key =
              `${source}::${target}::${edge.data?.relationType || "edge"}`;

            if (seenEdges.has(key)) {
              return;
            }

            seenEdges.add(key);
            displayEdges.push({
              ...edge,
              id: key,
              source,
              target,
            });
          });

        return {
          nodes: displayNodes,
          edges: displayEdges,
        };
      }

      function createStyledEdges(edges = []) {
        return edges.map((edge) => {
          return {
            ...edge,
            type: "smoothstep",
            sourceHandle: "child-source",
            targetHandle: "child-target",
            style: {
              stroke: "#94a3b8",
              strokeWidth: 2.2,
            },
            animated: false,
          };
        });
      }

      function FamilyMemberNode({
        data,
      }) {
        const isApplicant =
          data?.isApplicant;
        const generation =
          Number(data?.generationOffset || 0);
        const relation =
          normalizeRelation(
            data?.relationToApplicant
          );
        const married =
          data?.isMarried === true;
        const palette = isApplicant
          ? {
              border: "#0f766e",
              background: "linear-gradient(135deg, #ccfbf1, #ecfeff)",
              shadow: "0 18px 32px rgba(13, 148, 136, 0.2)",
            }
          : ["son", "grandson", "brother"].includes(relation)
            ? {
                border: "#7499E7",
                background: "linear-gradient(135deg, #e7f0ff, #f8fbff)",
                shadow: "0 12px 24px rgba(116, 153, 231, 0.18)",
              }
            : ["daughter", "sister","granddaughter","niece"].includes(relation) && married
              ? {
                  border: "#f59e0b",
                  background: "linear-gradient(135deg, #fff0db, #fff7ed)",
                  shadow: "0 12px 24px rgba(245, 158, 11, 0.18)",
                }
              : ["daughter", "sister","granddaughter","niece"].includes(relation)
                ? {
                    border: "#FFA5DB",
                    background: "linear-gradient(135deg, #ffe6f4, #fff6fb)",
                    shadow: "0 12px 24px rgba(255, 165, 219, 0.2)",
                  }
                : generation < 0
              ? {
                  border: "#7c3aed",
                  background: "linear-gradient(135deg, #ede9fe, #f5f3ff)",
                  shadow: "0 12px 24px rgba(124, 58, 237, 0.14)",
                }
              : generation > 1
                ? {
                    border: "#2563eb",
                    background: "linear-gradient(135deg, #dbeafe, #eff6ff)",
                    shadow: "0 12px 24px rgba(37, 99, 235, 0.14)",
                  }
                : {
                    border: "#14b8a6",
                    background: "linear-gradient(135deg, #ffffff, #f8fafc)",
                    shadow: "0 12px 24px rgba(20, 184, 166, 0.1)",
                  };

        const nodeStyle = {
          minWidth: data?.isCouple ? 240 : isApplicant ? 210 : 160,
          maxWidth: data?.isCouple ? 320 : isApplicant ? 260 : 220,
          borderRadius: 22,
          padding: isApplicant
            ? "14px 18px"
            : "12px 16px",
          fontSize: isApplicant ? 15 : 13,
          fontWeight: 700,
          color: "#0f172a",
          textAlign: "center",
          border: `2px solid ${palette.border}`,
          boxShadow: palette.shadow,
          background: palette.background,
          position: "relative",
          whiteSpace: "normal",
          lineHeight: 1.25,
        };

        const subtitleStyle = {
          marginTop: 6,
          fontSize: 11,
          fontWeight: 600,
          color: "#475569",
        };

        const handleBaseStyle = {
          width: 8,
          height: 8,
          borderRadius: 999,
          background: "#1e293b",
          border: "2px solid #fff",
        };

        return React.createElement(
          "div",
          {
            style: nodeStyle,
          },
          React.createElement(Handle, {
            type: "target",
            position: Position.Top,
            id: "child-target",
            style: handleBaseStyle,
          }),
          React.createElement(Handle, {
            type: "source",
            position: Position.Bottom,
            id: "child-source",
            style: handleBaseStyle,
          }),
          React.createElement(Handle, {
            type: "source",
            position: Position.Right,
            id: "spouse-right-out",
            style: handleBaseStyle,
          }),
          React.createElement(Handle, {
            type: "target",
            position: Position.Right,
            id: "spouse-right-in",
            style: {
              ...handleBaseStyle,
              opacity: 0,
            },
          }),
          React.createElement(Handle, {
            type: "source",
            position: Position.Left,
            id: "spouse-left-out",
            style: handleBaseStyle,
          }),
          React.createElement(Handle, {
            type: "target",
            position: Position.Left,
            id: "spouse-left-in",
            style: {
              ...handleBaseStyle,
              opacity: 0,
            },
          }),
          React.createElement(
            "div",
            null,
            data?.isCouple
              ? React.createElement(
                  React.Fragment,
                  null,
                  React.createElement(
                    "div",
                    {
                      style: {
                        display: "flex",
                        alignItems: "center",
                        justifyContent: "center",
                        gap: 8,
                        flexWrap: "wrap",
                      },
                    },
                    React.createElement(
                      "span",
                      null,
                      data?.primaryName || "Unnamed"
                    ),
                    React.createElement(
                      "span",
                      {
                        style: {
                          color: "#e11d48",
                          fontSize: 16,
                        },
                      },
                      "❤"
                    ),
                    React.createElement(
                      "span",
                      {
                        style: {
                          fontWeight: 600,
                        },
                      },
                      data?.partnerName || "Partner"
                    )
                  ),
                  (
                    ["daughter", "sister"].includes(relation)
                    && married
                    && data?.currentCity
                  )
                    ? React.createElement(
                        "div",
                        {
                          style: subtitleStyle,
                        },
                        data.currentCity
                      )
                    : null
                )
              : React.createElement(
                  React.Fragment,
                  null,
                  React.createElement(
                    "div",
                    null,
                    data?.label || "Unnamed member"
                  ),
                  (
                    ["daughter", "sister"].includes(relation)
                    && married
                    && (
                      data?.spouseName
                      || data?.currentCity
                    )
                  )
                    ? React.createElement(
                        "div",
                        {
                          style: subtitleStyle,
                        },
                        [
                          data?.spouseName
                            ? `Spouse: ${data.spouseName}`
                            : "",
                          data?.currentCity || "",
                        ]
                          .filter(Boolean)
                          .join(" · ")
                      )
                    : null
                )
          )
        );
      }

      function FlowToolbar({
        onFitView,
      }) {
        const panelStyle = {
          display: "flex",
          alignItems: "center",
          gap: 8,
          padding: "10px 12px",
          borderRadius: 18,
          background: "rgba(255,255,255,0.9)",
          backdropFilter: "blur(12px)",
          border: "1px solid rgba(148,163,184,0.2)",
          boxShadow: "0 10px 24px rgba(15, 23, 42, 0.08)",
          color: "#334155",
          fontSize: 13,
          fontWeight: 600,
        };

        const buttonStyle = {
          border: "none",
          borderRadius: 999,
          background: "linear-gradient(135deg, #14b8a6, #38bdf8)",
          color: "#fff",
          padding: "8px 12px",
          fontSize: 12,
          fontWeight: 700,
          cursor: "pointer",
        };

        return React.createElement(
          Panel,
          {
            position: "top-right",
          },
          React.createElement(
            "div",
            {
              style: panelStyle,
            },
            React.createElement(
              "span",
              null,
              "Drag to explore"
            )
          )
        );
      }

      function FlowCanvas({
        nodes,
        edges,
      }) {
        const displayGraph =
          React.useMemo(
            () => createDisplayGraph(nodes, edges),
            [nodes, edges]
          );

        const initialNodes =
          React.useMemo(
            () => {
              const styled = createStyledNodes(displayGraph.nodes);

              if (!styled.length) {
                return styled;
              }

              // Shift node positions so the tree's geometric center lands
              // at the container's center. The default ReactFlow viewport
              // (0, 0, 1) maps world (0,0) to screen (0,0); by encoding
              // the centering offset into the node positions themselves
              // we render centered without relying on the viewport API
              // (which is broken in this ESM dev build).
              const container =
                document.querySelector("#family-tree-flow");
              const containerWidth =
                container?.clientWidth || window.innerWidth || 1200;
              const containerHeight =
                container?.clientHeight || 619;

              const estimateSize = (node) => {
                if (node.data?.isCouple) {
                  return { width: 300, height: 120 };
                }
                if (node.data?.isApplicant) {
                  return { width: 240, height: 110 };
                }
                return { width: 200, height: 100 };
              };

              let minX = Infinity;
              let minY = Infinity;
              let maxX = -Infinity;
              let maxY = -Infinity;

              styled.forEach((node) => {
                const pos = node.position || { x: 0, y: 0 };
                const size = estimateSize(node);
                minX = Math.min(minX, pos.x);
                minY = Math.min(minY, pos.y);
                maxX = Math.max(maxX, pos.x + size.width);
                maxY = Math.max(maxY, pos.y + size.height);
              });

              const treeCenterX = (minX + maxX) / 2;
              const treeCenterY = (minY + maxY) / 2;
              const shiftX = containerWidth / 2 - treeCenterX;
              const shiftY = containerHeight / 2 - treeCenterY;

              return styled.map((node) => ({
                ...node,
                position: {
                  x: (node.position?.x || 0) + shiftX,
                  y: (node.position?.y || 0) + shiftY,
                },
              }));
            },
            [displayGraph]
          );

        const initialEdges =
          React.useMemo(
            () => {
              const nodesById =
                Object.fromEntries(
                  initialNodes.map((node) => [
                    node.id,
                    node,
                  ])
                );

              return createStyledEdges(
                displayGraph.edges.map((edge) => ({
                  ...edge,
                  __sourceNode: nodesById[edge.source],
                  __targetNode: nodesById[edge.target],
                }))
              );
            },
            [displayGraph, initialNodes]
          );

        const reactFlow = useReactFlow();

        // Toolbar fit button: re-center using fitView.
        const handleFitView = React.useCallback(() => {
          try {
            reactFlow.fitView({ padding: 0.2 });
          } catch (error) {
            // ignore
          }
        }, [reactFlow]);

        return React.createElement(
          ReactFlow,
          {
            defaultNodes: initialNodes,
            defaultEdges: initialEdges,
            fitView: false,
            minZoom: 0.1,
            maxZoom: 1.4,
            nodesDraggable: true,
            nodesConnectable: false,
            elementsSelectable: true,
            nodeTypes: {
              familyUnit: FamilyMemberNode,
            },
            proOptions: {
              hideAttribution: true,
            },
          },
          React.createElement(Background, {
            gap: 22,
            size: 1.2,
            color: "#dbeafe",
          }),
          React.createElement(Controls),
          React.createElement(FlowToolbar, {
            onFitView: handleFitView,
          })
        );
      }

      function FlowApp({
        nodes,
        edges,
      }) {
        return React.createElement(
          ReactFlowProvider,
          null,
          React.createElement(FlowCanvas, {
            nodes,
            edges,
          })
        );
      }

      async function loadTree() {
        try {
          const response =
            await fetch(
              `/api/family-tree/${memberId}`
            );

          if (!response.ok) {
            throw new Error(
              "Unable to load family tree."
            );
          }

          const payload =
            await response.json();
          const graph =
            payload.graph || {};
          const nodes =
            graph.nodes || [];
          const edges =
            graph.edges || [];

          titleElement.textContent =
            payload.member?.fullName
            || "Unnamed applicant";
          countElement.textContent =
            `${payload.member?.familyCount || nodes.length} visible family members`;

          // wire up View button and creator chip
          const viewButton = document.querySelector("#family-tree-view-button");
          const creatorChip = document.querySelector("#family-tree-creator");
          const creatorNameEl = document.querySelector("#family-tree-creator-name");
          const invitationButton = document.querySelector("#family-tree-invitation-button");
          const invitationChip = document.querySelector("#family-tree-invitation-chip");
          const invitationNameEl = document.querySelector("#family-tree-invitation-name");

          if (viewButton) {
            viewButton.style.display = "none";
            viewButton.addEventListener("click", () => {
              window.location.href = `/view-member/${memberId}`;
            });
          }

          if (creatorChip) {
            creatorChip.style.display = "none";
          }

          // Use createdBy supplied in /api/family-tree payload (authorized for operator)
          const createdByFromPayload = payload.member?.createdBy || "";
          const invitationName = payload.member?.invitationName || "";
          const role = window.CURRENT_ROLE || "";
          const isViewer = role === "viewer";
          const isAdmin = role === "admin" || role === "super_admin";

          if (createdByFromPayload && !isViewer) {
            if (creatorNameEl) {
              creatorNameEl.textContent = `Added By ${createdByFromPayload}`;
            }
            if (creatorChip) creatorChip.style.display = "inline-flex";
          } else if (creatorChip) {
            creatorChip.style.display = "none";
          }

          // Invitation name display — visible to ALL roles when set.
          if (invitationName && invitationChip && invitationNameEl) {
            invitationNameEl.textContent = `✉ ${invitationName}`;
            invitationChip.style.display = "inline-flex";

            // Admins can click the chip to edit the invitation name.
            if (isAdmin) {
              invitationChip.style.cursor = "pointer";
              invitationChip.title = "Click to edit invitation name";
              invitationChip.addEventListener("click", () => {
                openTreeInvitationModal(memberId, invitationName);
              });
            }
          }

          // Admins with no invitation name yet get a "Set Invitation" button.
          if (isAdmin && invitationButton && !invitationName) {
            invitationButton.textContent = "✉ Set Invitation";
            invitationButton.style.display = "inline-flex";
            invitationButton.addEventListener("click", () => {
              openTreeInvitationModal(memberId, invitationName);
            });
          }

          if (viewButton) {
            viewButton.style.display = "inline-flex";
          }

          flowElement.innerHTML = "";
          const root =
            createRoot(flowElement);

          root.render(
            React.createElement(
              FlowApp,
              {
                nodes,
                edges,
              }
            )
          );
        } catch (error) {
          renderError(
            error.message ||
            "Unable to load family tree."
          );
        }
      }

      function openTreeInvitationModal(memberId, currentName) {
        let modal = document.getElementById("treeInvitationModal");
        if (!modal) {
          modal = document.createElement("div");
          modal.id = "treeInvitationModal";
          modal.style.cssText = `
            display:none; position:fixed; inset:0; z-index:9999;
            background:rgba(0,0,0,0.4); backdrop-filter:blur(4px);
            align-items:center; justify-content:center;
          `;
          modal.innerHTML = `
            <div style="
              background:#fff; border-radius:20px; padding:28px 32px;
              max-width:420px; width:90%; box-shadow:0 20px 60px rgba(0,0,0,0.15);
            ">
              <h3 style="margin:0 0 6px; font-size:20px; font-weight:700;">Set Invitation Name</h3>
              <p style="margin:0 0 18px; color:#64748b; font-size:14px;">
                This name will appear on wedding invitations for this household.
              </p>
              <input
                id="treeInvitationInput"
                type="text"
                placeholder="e.g. Shri. Ramesh Patil & Family"
                style="
                  width:100%; height:48px; border-radius:12px;
                  border:1px solid #cbd5e1; padding:0 14px;
                  font-size:16px; outline:none;
                "
              >
              <div style="display:flex; gap:10px; margin-top:18px; justify-content:flex-end;">
                <button id="treeInvCancelBtn" type="button" style="
                  padding:10px 20px; border-radius:10px; border:1px solid #e2e8f0;
                  background:#fff; font-weight:600; cursor:pointer;
                ">Cancel</button>
                <button id="treeInvSaveBtn" type="button" style="
                  padding:10px 20px; border-radius:10px; border:none;
                  background:#7c3aed; color:#fff; font-weight:600; cursor:pointer;
                ">Save</button>
              </div>
              <p id="treeInvModalMsg" style="margin:12px 0 0; font-size:13px; color:#dc2626; display:none;"></p>
            </div>
          `;
          document.body.appendChild(modal);
          document.getElementById("treeInvCancelBtn").addEventListener("click", () => {
            modal.style.display = "none";
          });
          modal.addEventListener("click", (e) => {
            if (e.target === modal) modal.style.display = "none";
          });
        }

        const input = document.getElementById("treeInvitationInput");
        const msg = document.getElementById("treeInvModalMsg");
        input.value = currentName || "";
        msg.style.display = "none";
        modal.style.display = "flex";
        input.focus();

        const saveBtn = document.getElementById("treeInvSaveBtn");
        const newBtn = saveBtn.cloneNode(true);
        saveBtn.parentNode.replaceChild(newBtn, saveBtn);
        newBtn.addEventListener("click", async () => {
          const invitationName = (input.value || "").trim();
          newBtn.disabled = true;
          newBtn.textContent = "Saving...";
          msg.style.display = "none";

          try {
            const res = await fetch(`/api/registrations/${memberId}/invitation-name`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ invitationName }),
            });
            if (!res.ok) {
              const body = await res.json().catch(() => ({}));
              throw new Error(body.error || "Failed to save");
            }
            modal.style.display = "none";
            // Update the button text
            const btn = document.querySelector("#family-tree-invitation-button");
            if (btn) {
              btn.textContent = invitationName
                ? `✉ ${invitationName}`
                : "✉ Set Invitation";
            }
          } catch (err) {
            msg.textContent = err.message || "Failed to save";
            msg.style.display = "block";
          } finally {
            newBtn.disabled = false;
            newBtn.textContent = "Save";
          }
        });
      }

      loadTree();
    </script>
  </body>
</html>
